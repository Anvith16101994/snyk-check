name: "PR Quality & Standards Enforcement"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: "Validate PR Standards"
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR Title: '$PR_TITLE'"
          # Regex for Conventional Commits: feat, fix, chore, docs, refactor, test, ci, etc.
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "❌ ERROR: PR Title must follow Conventional Commits format!"
            echo "Example: feat(auth): add OAuth login flow"
            echo "Example: fix(api): handle timeout exception"
            exit 1
          fi
          echo "✅ PR Title is valid."

      - name: Validate PR Description / Body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip whitespace and check length
          TRIMMED_BODY=$(echo "$PR_BODY" | tr -d '[:space:]')
          
          if [[ -z "$TRIMMED_BODY" || ${#TRIMMED_BODY} -lt 20 ]]; then
            echo "❌ ERROR: PR description is too short or empty!"
            echo "Please provide a meaningful description explaining the changes."
            exit 1
          fi
          echo "✅ PR Description is valid."
